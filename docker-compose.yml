services:
    postgres:
        image: postgres:16-alpine
        container_name: hivepoint-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: hivepoint
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
    redis:
        image: redis:7-alpine
        container_name: hivepoint-redis
        ports:
            - '6379:6379'
    stripe-cli:
        image: stripe/stripe-cli:latest
        container_name: hivepoint-stripe-cli
        profiles:
            - stripe
        command:
            - listen
            - --api-key
            - ${STRIPE_SECRET_KEY:-}
            - --forward-to
            - http://host.docker.internal:3000/billing/stripe/webhook
        extra_hosts:
            - 'host.docker.internal:host-gateway'
volumes:
    postgres_data:
